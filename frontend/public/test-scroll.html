<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>滚动条测试</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #f6f9fb;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      border: 1px solid #e3e8ec;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 600px;
    }

    .header {
      padding: 16px;
      background: #edf3f7;
      border-bottom: 1px solid #e3e8ec;
      flex-shrink: 0;
    }

    .message-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 18px;
      scrollbar-width: thin;
    }

    .message-list::-webkit-scrollbar {
      width: 12px;
    }

    .message-list::-webkit-scrollbar-track {
      background: #edf3f7;
      border-radius: 6px;
      box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.1);
    }

    .message-list::-webkit-scrollbar-thumb {
      background: #dbeff8;
      border-radius: 6px;
      border: 2px solid transparent;
      background-clip: padding-box;
      min-height: 20px;
    }

    .message-list::-webkit-scrollbar-thumb:hover {
      background: #2a93c7;
      background-clip: padding-box;
    }

    .message {
      padding: 12px;
      margin-bottom: 12px;
      background: #edf3f7;
      border-radius: 10px;
    }

    .footer {
      padding: 16px;
      background: #edf3f7;
      border-top: 1px solid #e3e8ec;
      flex-shrink: 0;
    }

    button {
      padding: 8px 16px;
      background: #4fb8e6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #2a93c7;
    }

    .info {
      margin-top: 20px;
      padding: 16px;
      background: white;
      border-radius: 10px;
      border: 1px solid #e3e8ec;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .info h3 {
      margin-bottom: 12px;
      color: #18191c;
    }

    .info p {
      margin-bottom: 8px;
      color: #61666d;
      line-height: 1.6;
    }

    .info code {
      background: #edf3f7;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>滚动条测试</h2>
    </div>
    <div class="message-list" id="messageList">
      <!-- 消息将通过JS添加 -->
    </div>
    <div class="footer">
      <button onclick="addMessages()">添加10条消息</button>
      <button onclick="clearMessages()">清空消息</button>
    </div>
  </div>

  <div class="info">
    <h3>布局关键点</h3>
    <p><strong>1. 容器高度：</strong> <code>height: 600px</code> - 必须有明确高度</p>
    <p><strong>2. Flex布局：</strong> <code>display: flex; flex-direction: column</code></p>
    <p><strong>3. 消息列表：</strong> <code>flex: 1; min-height: 0; overflow-y: auto</code></p>
    <p><strong>4. 头部/底部：</strong> <code>flex-shrink: 0</code> - 防止被压缩</p>
    <p><strong>关键：</strong> <code>min-height: 0</code> 允许flex子元素收缩到内容以下，触发滚动</p>
  </div>

  <script>
    let messageCount = 0;

    function addMessages() {
      const list = document.getElementById('messageList');
      for (let i = 0; i < 10; i++) {
        messageCount++;
        const div = document.createElement('div');
        div.className = 'message';
        div.textContent = `消息 ${messageCount}：这是一条测试消息，用来验证滚动条是否正常工作。`;
        list.appendChild(div);
      }
      list.scrollTop = list.scrollHeight;
    }

    function clearMessages() {
      document.getElementById('messageList').innerHTML = '';
      messageCount = 0;
    }

    // 初始添加一些消息
    addMessages();
    addMessages();
  </script>
</body>
</html>
