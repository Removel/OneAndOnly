# Planner Agent Configuration
model_config:
  model_name: "gpt-3.5-turbo"  # Model name for planning tasks
  temperature: 0.7             # Creativity parameter
  max_tokens: 512              # Maximum tokens for response
api_config:
  base_url: "https://api.openai.com/v1"  # API endpoint
  api_key_env: "OPENAI_API_KEY"          # Name of environment variable containing the API key
agent_config:
  role: "Planner"                        # Role of the agent
  description: "Responsible for understanding intent, generating thoughts, and deciding whether to call skills"