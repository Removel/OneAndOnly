# Evaluator Agent Configuration
model_config:
  model_name: "gpt-3.5-turbo"   # Model name for evaluation tasks
  temperature: 0.2               # Low temperature for consistent evaluations
  max_tokens: 256                # Maximum tokens for response
api_config:
  base_url: "https://api.openai.com/v1"  # API endpoint
  api_key_env: "OPENAI_API_KEY"          # Name of environment variable containing the API key
agent_config:
  role: "Evaluator"                      # Role of the agent
  description: "Evaluates text, emotions, and actions for consistency and reasonableness"